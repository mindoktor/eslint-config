name: CI Checks

# Read-only by default; the auto-merge job below elevates its own permissions.
permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  lint_typecheck:
    runs-on: ubuntu-latest

    steps:
    # Actions are pinned to commit SHAs, not mutable tags: a tag can be moved to
    # point at new code, so a tag ref is not a fixed thing to review. Dependabot
    # keeps these SHAs current (see the github-actions block in dependabot.yml).
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        # Pin CI to the repo's .nvmrc (v24) rather than always-latest, so CI
        # matches local/dev and a future Node major can't silently break the
        # rule-drift test or the auto-merge path.
        node-version-file: '.nvmrc'
        cache: 'yarn'
    # --ignore-scripts: don't run dependency install hooks. It closes the
    # install-time hook vector, which matters most for auto-merged bumps. Nothing
    # here needs them — the one dep declaring a postinstall (unrs-resolver) gets
    # its native binding from optionalDependencies instead.
    - run: yarn install --frozen-lockfile --ignore-scripts
    # lint builds dist/ first via its prelint hook (the fixtures config imports
    # dist/), and test builds via pretest — so no standalone build step is needed.
    - run: yarn lint
    - run: yarn typecheck
    - run: yarn test

  # Auto-merge Dependabot PRs, gated on the checks passing via `needs:`. Kept a
  # separate job (not a trailing step) so the checks job stays read-only and the
  # write-capable token exists only here — the untrusted dependency changes run
  # under the read-only checks job, never under this write-scoped one.
  #
  # NOTE: full auto-merge also needs two repo settings this workflow can't set:
  # the "Allow auto-merge" repo setting, and a branch rule on develop with a
  # required check — without a pending requirement, a PR that isn't immediately
  # mergeable has no deferred merge to enable. See GitHub's auto-merge docs:
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/incorporating-changes-from-a-pull-request/automatically-merging-a-pull-request
  dependabot-automerge:
    needs: lint_typecheck
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Enable auto-merge for Dependabot PRs
      run: gh pr merge --auto --squash "$PR_URL"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

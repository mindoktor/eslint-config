# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a day after a release before opening a PR, so a bad version's issues
    # can surface first and be more likely already handled (or the package
    # retracted) by that time.
    cooldown:
      default-days: 1
    # Group all deps into one PR instead of a dozen; the set is verified together.
    groups:
      all-dependencies:
        patterns:
          - "*"
    # Majors get a human. A major can be clean here yet break a consumer, which
    # this repo's own checks can't see — and grouped auto-merge would otherwise
    # land it unattended. Bump majors deliberately in their own PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    # Majors get a human here too: an action major (e.g. checkout v4 -> v5) can
    # break the workflow that is supposed to be gating the merge.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
